<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philosophia &mdash; Dialogues with Great Thinkers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.88em' font-size='85' font-family='serif'%3E%CE%A6%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Main content -->
    <main class="main" id="main">

      <!-- Welcome screen -->
      <div class="welcome" id="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-phi">&Phi;</div>
          <h2 class="welcome-title">Philosophia</h2>
          <p class="welcome-subtitle">Dialogues with Great Thinkers</p>
          <div class="ornamental-divider"><span></span></div>
          <p class="welcome-cta">Choose a philosopher to begin your dialogue</p>
          <div class="philosopher-grid" id="philosopher-grid">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Chat interface -->
      <div class="chat-container" id="chat-container" hidden>
        <div class="chat-header" id="chat-header">
          <div class="chat-header-left">
            <button class="back-btn" id="back-btn" aria-label="Back to philosophers">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="chat-header-avatar" id="chat-avatar"></div>
            <div class="chat-header-info">
              <h2 id="chat-philosopher-name"></h2>
              <p id="chat-philosopher-meta"></p>
            </div>
          </div>
          <button class="new-dialogue-btn" id="new-dialogue-btn" title="Start a new dialogue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>New Dialogue</span>
          </button>
        </div>

        <div class="chat-header-divider"><span></span></div>

        <div class="messages-wrapper" id="messages-wrapper">
          <div class="messages" id="messages">
            <!-- Rendered by JS -->
          </div>
        </div>

        <div class="typing-indicator" id="typing-indicator" hidden>
          <div class="typing-avatar" id="typing-avatar"></div>
          <div class="typing-body">
            <div class="typing-dots"><span></span><span></span><span></span></div>
            <span class="typing-label" id="typing-label">contemplating...</span>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <textarea
              id="message-input"
              placeholder="Pose your question..."
              rows="1"
              aria-label="Your message"
            ></textarea>
            <button class="send-btn" id="send-btn" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
          <p class="input-hint">Enter to send &middot; Shift+Enter for new line</p>
        </div>
      </div>

    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
